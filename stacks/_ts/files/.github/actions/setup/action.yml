# Stack-owned (Shipify; replaced by `ship upgrade`). The Shipify pipeline runs this before
# `make setup`: Node from .nvmrc and pnpm from package.json, with the pnpm store cached.
name: setup
description: Node and pnpm for this project's make targets.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
